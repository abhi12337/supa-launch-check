[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supa-launch-check"
version = "0.1.0"
description = "Pre-launch security checker for Supabase-backed apps: leaked service keys, missing RLS, open policies, public buckets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abheesht Tripathi" }]
keywords = ["supabase", "security", "rls", "postgres", "lovable", "bolt", "cursor", "secrets", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
supa-launch-check = "supa_launch_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/abhi12337/supa-launch-check"
Issues = "https://github.com/abhi12337/supa-launch-check/issues"
